[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#3F7D0A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F8EE"
textColor = "#1d1d1f"
font = "sans serif"

[client]
# never show tracebacks or error details to viewers (errors still go to the server logs)
showErrorDetails = "none"
